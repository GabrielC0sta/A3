  <script>
    // Rotação 3D nos cards ao mover mouse
    document.querySelectorAll('.card').forEach(card => {
      card.addEventListener('mousemove', e => {
        const rect = card.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const y = e.clientY - rect.top;
        const centerX = rect.width / 2;
        const centerY = rect.height / 2;
        const rotateX = -(y - centerY) / 15;
        const rotateY = (x - centerX) / 15;
        card.style.transform = `rotateX(${rotateX}deg) rotateY(${rotateY}deg) scale(1.05)`;
      });

      card.addEventListener('mouseleave', () => {
        card.style.transform = 'rotateX(0deg) rotateY(0deg) scale(1)';
      });
    });

    // Scroll horizontal por arrastar na div .team-container
    const container = document.querySelector('.team-container');
    if (container) {
      let isDown = false;
      let startX;
      let scrollLeft;

      container.addEventListener('mousedown', (e) => {
        isDown = true;
        container.classList.add('dragging');
        startX = e.pageX - container.offsetLeft;
        scrollLeft = container.scrollLeft;
      });
      container.addEventListener('mouseleave', () => {
        isDown = false;
        container.classList.remove('dragging');
      });
      container.addEventListener('mouseup', () => {
        isDown = false;
        container.classList.remove('dragging');
      });
      container.addEventListener('mousemove', (e) => {
        if (!isDown) return;
        e.preventDefault();
        const x = e.pageX - container.offsetLeft;
        // Diminua o fator de velocidade (quanto maior o divisor, mais lenta a rolagem)
        const walk = (x - startX) / 1; // 3 = mais lento, 2 = padrão, 1 = rápido
        container.scrollLeft = scrollLeft - walk;
      });
    }
  </script>
